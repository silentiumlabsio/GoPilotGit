name: Feature request
description: Suggest a public-facing GoPilot improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Driver problem
      description: What workflow problem would this solve?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Suggested improvement
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Saved Trips
        - Permit Reader
        - Route Review
        - Mileage
        - Receipts / Expenses
        - Invoices
        - Trip Command Center
        - Pro tools
        - Other

  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: My request does not contain private trip/customer data or credentials.
          required: true
